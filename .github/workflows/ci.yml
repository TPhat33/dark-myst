name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rules:
    name: Game rules and content
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Only the game-rule test projects — DarkMyst.Api.Tests needs a live Postgres and runs in
      # its own "backend" job below, where that service is actually available.
      - name: Test
        run: |
          dotnet test tests/DarkMyst.Combat.Tests --no-build -c Release --verbosity normal
          dotnet test tests/DarkMyst.Content.Tests --no-build -c Release --verbosity normal
          dotnet test tests/DarkMyst.Expedition.Tests --no-build -c Release --verbosity normal

      # Catches a broken reference in content/ even when no test happens to touch it.
      - name: Validate the content pack
        run: dotnet run --project tools/DarkMyst.SimRunner -c Release --no-build -- validate

      # A rule change that quietly makes an encounter unwinnable should show up in review,
      # not in a player's session.
      - name: Balance sweep
        run: |
          for encounter in enc_tutorial_hounds enc_crypt_patrol enc_warlock_conclave enc_boss_ashen_revenant; do
            dotnet run --project tools/DarkMyst.SimRunner -c Release --no-build -- \
              sweep --encounter "$encounter" --repeat 200
            echo
          done

      # Same reasoning as the battle sweep above, one layer up: a content change that quietly
      # makes an expedition stage unwinnable (or trivial) at its recommended level should show
      # up here, not in a player's farming session.
      - name: Expedition sweep
        run: |
          for level in 4 12 20; do
            dotnet run --project tools/DarkMyst.SimRunner -c Release --no-build -- \
              expedition --stage stg_ashfields --repeat 200 --level "$level"
            echo
          done

      # Roster diversity: a content change that quietly makes one team dominant, one line dead
      # weight, or a losing team's comp swap stop mattering should show up here, not in a
      # balance review months later. Kept to one level and 100 seeds/cell (a fraction of the
      # 300+ used to write the numbers into docs/07-testing-plan.md) so it stays fast in CI;
      # the full sweep is a manual `simrunner matrix` run, not a CI job.
      - name: Roster matrix
        run: |
          dotnet run --project tools/DarkMyst.SimRunner -c Release --no-build -- \
            matrix --level 12 --repeat 100 \
            --rosters "core_balanced=chr_ashen_knight_i,chr_grave_warden_i,chr_ember_adept_i,chr_tide_oracle_i,chr_pale_stalker_i;no_healer=chr_ashen_knight_i,chr_grave_warden_i,chr_thorn_maiden_i,chr_mire_hexer_i,chr_pale_stalker_i;swap_shackleborn=chr_ashen_knight_i,chr_grave_warden_i,chr_shackleborn_i,chr_tide_oracle_i,chr_pale_stalker_i;swap_bramble_warden=chr_bramble_warden_i,chr_grave_warden_i,chr_ember_adept_i,chr_tide_oracle_i,chr_pale_stalker_i"

  backend:
    name: Game API (server/DarkMyst.Api)
    runs-on: ubuntu-latest

    # docs/10-backend-spec.md: every DarkMyst.Api.Tests case runs against a real Postgres, never
    # a mock or an InMemory provider — this service container is that Postgres for CI. The
    # POSTGRES_USER here becomes the cluster's initial (superuser-equivalent) role, so it has the
    # CREATEDB privilege each test class's throwaway database needs, matching the local dev setup
    # this project assumes (docs/10-backend-spec.md's testing section).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: darkmyst
          POSTGRES_PASSWORD: darkmyst_dev
          POSTGRES_DB: darkmyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Each test class provisions and migrates its own throwaway database (Infra/
      # PostgresTestDatabase.cs) — no separate "run migrations" step is needed here, the same as
      # a developer running this locally never needs one either.
      - name: Test
        run: dotnet test tests/DarkMyst.Api.Tests --no-build -c Release --verbosity normal

  admin:
    name: Admin tool (admin/) — build, unit tests, Playwright
    runs-on: ubuntu-latest

    # docs/11-admin-spec.md: admin/e2e/run-api.sh stands up a real DarkMyst.Api against a scratch
    # database of its own (created and dropped by that script, never this container's "darkmyst"
    # database directly) — same service container shape as the "backend" job above, for the same
    # reason: no mock, no InMemory provider, a real Postgres the publish/rollback loop actually
    # writes through.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: darkmyst
          POSTGRES_PASSWORD: darkmyst_dev
          POSTGRES_DB: darkmyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # admin/e2e/run-api.sh launches the API with `dotnet run --no-build`, so it has to already
      # be built before Playwright's webServer tries to start it.
      - name: Restore and build the API
        run: |
          dotnet restore
          dotnet build server/DarkMyst.Api -c Release --no-restore

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build the admin front end
        working-directory: admin
        run: npm run build

      - name: Admin unit tests
        working-directory: admin
        run: npm test

      # This runner has no pre-installed browser (unlike the sandbox admin/playwright.config.ts
      # also has to work in) — download Chromium here.
      - name: Install Playwright's Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        working-directory: admin
        run: npm run test:e2e
